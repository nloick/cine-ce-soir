  .small { font-size: 13px; }

    .strip { grid-template-columns: repeat(3, 1fr); }

// Ordre dans lequel les critères sont assouplis quand la recherche est trop restrictive.
const RELAX_STEPS = [

  answers: {},
  candidates: [],

  relaxed: [],

};

const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const question = (id) => QUESTIONS.find((q) => q.id === id);
const option = (qid, v) => question(qid).options.find((o) => o.v === v);
const seen = () => new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"));

// ---------- TMDB ----------

async function tmdb(path, params = {}, key = state.key) {
  const url = new URL(TMDB + path);
  const headers = { accept: "application/json" };
  // Un jeton v4 est un JWT (commence par « eyJ ») ; une clé v3 passe en paramètre.
  if (key.startsWith("eyJ")) headers.Authorization = `Bearer ${key}`;
  else url.searchParams.set("api_key", key);
  Object.entries(params).forEach(([k, v]) => v !== undefined && v !== null && v !== "" && url.searchParams.set(k, v));
  const res = await fetch(url, { headers });
  if (res.status === 401) throw Object.assign(new Error("Clé TMDB refusée"), { auth: true });
  if (!res.ok) throw new Error(`TMDB ${res.status}`);
  return res.json();
}

async function loadReferenceData() {
  const [genres, providers] = await Promise.all([
    tmdb("/genre/movie/list", { language: "fr-FR" }),
    tmdb("/watch/providers/movie", { watch_region: "FR", language: "fr-FR" }).catch(() => ({ results: [] })),
  ]);
  genres.genres.forEach((g) => (state.genreNames[g.id] = g.name));
  // Les identifiants de plateformes sont relus chez TMDB pour rester justes si le catalogue change.
  question("providers").options.forEach((o) => {
    if (!o.match) return;
    const found = providers.results.find((p) => o.match.test(p.provider_name));
    if (!found) return;
    o.id = found.provider_id;
    o.logo = found.logo_path;
  });
}

function discoverParams(relaxed) {
  const a = state.answers;
  const p = {
    language: "fr-FR", region: "FR", include_adult: "false", include_video: "false",
    "vote_count.gte": 300, "with_runtime.gte": 60,
  };

  const moodGenres = [...new Set(a.mood.flatMap((v) => option("mood", v).g))];
  if (moodGenres.length) p.with_genres = moodGenres.join("|");

  const excluded = excludedGenres();
  if (excluded.size) p.without_genres = [...excluded].join(",");
  if (a.company === "kids") {
    p.certification_country = "US";
    p["certification.lte"] = "PG";
  }

  if (!relaxed.has("runtime")) {
    const r = option("runtime", a.runtime);
    p["with_runtime.gte"] = r.min;
    p["with_runtime.lte"] = r.max;
  }
  if (!relaxed.has("era")) {
    const e = option("era", a.era);
    p["primary_release_date.gte"] = e.from;
    p["primary_release_date.lte"] = e.to;
  }
  if (!relaxed.has("origin")) p.with_original_language = option("origin", a.origin).lang;

  const minNote = relaxed.has("quality") ? 5.5 : a.energy === "high" ? 7 : 6.3;
  p["vote_average.gte"] = minNote;
  if (!relaxed.has("fame")) {
    if (a.fame === "classic") p["vote_count.gte"] = 4000;
    if (a.fame === "gem") {
      p["vote_count.gte"] = 120;
      p["vote_count.lte"] = 2500;
      p["vote_average.gte"] = Math.max(minNote, relaxed.has("quality") ? 6.5 : 7);
    }
  }

  if (!relaxed.has("providers") && !a.providers.includes("all")) {
    const ids = a.providers.map((v) => option("providers", v).id).filter(Boolean);
    p.watch_region = "FR";
    const free = a.providers.includes("free");
    p.with_watch_monetization_types = !free ? "flatrate" : ids.length ? "flatrate|free|ads" : "free|ads";
    if (ids.length) p.with_watch_providers = ids.join("|");
  }
  return p;
}

function excludedGenres() {
  const a = state.answers;
  const set = new Set(a.avoid.flatMap((v) => option("avoid", v).g || []));
  if (a.company === "kids") set.add(G.horror);
  // Une envie explicite l'emporte sur une exclusion contradictoire.
  a.mood.flatMap((v) => option("mood", v).g).forEach((g) => set.delete(g));
  return set;
}

async function fetchPool(relaxed) {
  const params = discoverParams(relaxed);
  const first = await tmdb("/discover/movie", { ...params, sort_by: "popularity.desc", page: 1 });
  if (!first.total_results) return [];
  const extra = [tmdb("/discover/movie", { ...params, sort_by: "vote_average.desc", page: 1 })];
  // Une page tirée au hasard évite de proposer toujours les mêmes têtes d'affiche.
  const maxPage = Math.min(first.total_pages, 8);
  if (maxPage > 1) extra.push(tmdb("/discover/movie", { ...params, sort_by: "popularity.desc", page: 2 + Math.floor(Math.random() * (maxPage - 1)) }));
  const pages = [first, ...(await Promise.all(extra.map((p) => p.catch(() => ({ results: [] })))))];
  const byId = new Map();
  pages.flatMap((pg) => pg.results).forEach((m) => byId.set(m.id, m));
  const excluded = excludedGenres();
  const alreadySeen = seen();
  return [...byId.values()].filter((m) => !alreadySeen.has(m.id) && !m.genre_ids.some((g) => excluded.has(g)));
}

const ENERGY_BOOST = {
  low: { [G.comedy]: 1, [G.animation]: 1, [G.family]: 0.8, [G.action]: 0.8, [G.adventure]: 0.8, [G.romance]: 0.6, [G.fantasy]: 0.5, [G.drama]: -1.2, [G.thriller]: -0.6, [G.crime]: -0.5, [G.horror]: -0.5, [G.documentary]: -1.5, [G.history]: -1.2, [G.war]: -1.5 },
  mid: {},
  high: { [G.drama]: 1, [G.mystery]: 0.8, [G.scifi]: 0.6, [G.documentary]: 0.6, [G.history]: 0.6, [G.thriller]: 0.5, [G.family]: -0.8 },
};
const COMPANY_BOOST = {
  couple: { [G.romance]: 0.7, [G.comedy]: 0.3 },
  friends: { [G.comedy]: 0.6, [G.action]: 0.5, [G.horror]: 0.5 },
  kids: { [G.family]: 1.5, [G.animation]: 1.2, [G.adventure]: 0.5 },
  solo: {},
};

function score(m) {
  const a = state.answers;
  const moods = a.mood.filter((v) => v !== "any");
  const matched = moods.filter((v) => option("mood", v).g.some((g) => m.genre_ids.includes(g))).length;
  // Un film qui coche toutes les envies passe devant celui qui n'en coche qu'une.
  const overlap = matched + (moods.length > 1 && matched === moods.length ? 1.2 : 0);
  const boost = (table) => Math.max(-2, Math.min(2, m.genre_ids.reduce((s, g) => s + (table[g] || 0), 0)));
  const votes = Math.log10(Math.max(10, m.vote_count));
  const fame = a.fame === "classic" ? votes * 0.9 : a.fame === "gem" ? -votes * 0.3 : votes * 0.35;
  const quality = (m.vote_average - 6.5) * (a.energy === "high" ? 1.6 : 1.1);
  return overlap * 1.8 + quality + fame + boost(ENERGY_BOOST[a.energy]) + boost(COMPANY_BOOST[a.company]) + Math.random() * 1.4;
}

async function search() {
  render(loadingScreen());
  const started = Date.now();
  try {
    const relaxed = new Set();
    let pool = await fetchPool(relaxed);
    for (const step of RELAX_STEPS) {
      if (pool.length >= 4) break;
      relaxed.add(step.key);
      pool = await fetchPool(relaxed);
    }
    state.relaxed = RELAX_STEPS.filter((s) => relaxed.has(s.key)).map((s) => s.label);
    state.candidates = pool.map((m) => ({ m, s: score(m) })).sort((x, y) => y.s - x.s).map((x) => x.m);
    state.index = 0;
    // Petit suspense : l'écran de chargement reste au moins un instant.
    await new Promise((r) => setTimeout(r, Math.max(0, 1600 - (Date.now() - started))));
    if (!state.candidates.length) return render(emptyScreen());
    await showCandidate(0);
  } catch (err) {
    handleError(err);
  }
}

async function getDetails(id) {
  if (state.details[id]) return state.details[id];
  const d = await tmdb(`/movie/${id}`, { language: "fr-FR", append_to_response: "videos,watch/providers,credits", include_video_language: "fr,en,null" });
  if (!d.overview) {
    const en = await tmdb(`/movie/${id}`, { language: "en-US" }).catch(() => null);
    if (en?.overview) d.overview = en.overview;
  }
  state.details[id] = d;
  return d;
}

async function showCandidate(i) {
  if (i >= state.candidates.length) return render(emptyScreen(true));
  state.index = i;
  try {
    const d = await getDetails(state.candidates[i].id);
    render(resultScreen(d));
    // Précharge le suivant pour que « Autre chose » soit instantané.
    if (state.candidates[i + 1]) getDetails(state.candidates[i + 1].id).catch(() => {});
  } catch (err) {
    handleError(err);
  }
}

function handleError(err) {
  if (err.auth) {
    localStorage.removeItem(STORE_KEY);
    state.key = "";
    return render(setupScreen("La clé TMDB a été refusée, vérifie-la."));
  }
  render(`<section class="screen hero">
    <div class="emoji">📡</div>
    <h2>Oups, impossible de joindre la base de films</h2>
    <p class="muted">${esc(err.message)} — vérifie la connexion internet.</p>
    <button class="btn" data-action="retry">Réessayer</button>
  </section>`);
}

// ---------- Écrans ----------

function render(html) {
  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: "instant" });
}

function welcomeScreen() {

  return `<section class="screen hero">
    <div class="emoji">🍿</div>

    <p class="muted">9 petites questions, et je trouve le film parfait parmi tous les films qui existent.</p>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn big" data-action="start">Trouver mon film</button>
    </div>

}

function questionScreen() {
  const q = QUESTIONS[state.step];
  const chosen = state.answers[q.id] ? [].concat(state.answers[q.id]) : [];
  const opts = q.options.map((o) => {
    const icon = o.logo ? `<img src="${IMG}w92${o.logo}" alt="">` : o.e;
    return `<button class="opt ${chosen.includes(o.v) ? "sel" : ""}" data-opt="${o.v}">
      <span class="e">${icon}</span><span class="l">${esc(o.l)}</span>${o.d ? `<span class="d">${esc(o.d)}</span>` : ""}
    </button>`;
  }).join("");
  const pct = Math.round((state.step / QUESTIONS.length) * 100);
  const next = q.multi
    ? `<div class="footer"><button class="btn" data-action="next" ${chosen.length ? "" : "disabled"}>${state.step === QUESTIONS.length - 1 ? "Voir mon film 🎬" : "Suivant →"}</button></div>`
    : "";
  return `<section class="screen">
    <div class="topbar">
      <button class="back" data-action="back">← Retour</button>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <span class="step">${state.step + 1}/${QUESTIONS.length}</span>
    </div>
    <h2>${esc(q.title)}</h2>
    ${q.hint ? `<p class="muted small" style="margin:0">${esc(q.hint)}</p>` : ""}
    <div class="options">${opts}</div>
    ${next}
  </section>`;
}

function loadingScreen() {
  setTimeout(cycleLoadingLines, 0);
  return `<section class="screen loading">
    <div class="reel">🎞️</div>
    <h2 id="loading-line">${LOADING_LINES[0]}</h2>
  </section>`;
}

function cycleLoadingLines() {
  let i = 0;
  const timer = setInterval(() => {
    const el = document.getElementById("loading-line");
    if (!el) return clearInterval(timer);
    i = (i + 1) % LOADING_LINES.length;
    el.textContent = LOADING_LINES[i];
  }, 700);
}

function emptyScreen(exhausted = false) {
  return `<section class="screen hero">
    <div class="emoji">🙈</div>
    <h2>${exhausted ? "Tu as fait le tour de mes idées !" : "Aucun film ne coche toutes ces cases"}</h2>
    <p class="muted">Essaie avec des envies un peu plus larges.</p>
    <button class="btn" data-action="restart">Recommencer</button>
  </section>`;
}

function formatRuntime(min) {
  if (!min) return "";
  const h = Math.floor(min / 60);
  const m = String(min % 60).padStart(2, "0");
  return h ? `${h}h${m}` : `${min} min`;
}

function providersOf(d) {
  const fr = d["watch/providers"]?.results?.FR;
  if (!fr) return { list: [], link: null, kind: null };
  const sub = uniqueProviders([...(fr.flatrate || []), ...(fr.free || []), ...(fr.ads || [])]);
  if (sub.length) return { list: sub, link: fr.link, kind: "Inclus dans" };
  const rent = uniqueProviders([...(fr.rent || []), ...(fr.buy || [])]);
  return { list: rent, link: fr.link, kind: rent.length ? "À louer ou acheter sur" : null };
}

// TMDB liste aussi les variantes d'une même plateforme (« with Ads », « Amazon Channel ») : une seule icône suffit.
function uniqueProviders(list) {
  const seenNames = new Set();
  return list.filter((p) => {
    const name = p.provider_name.replace(/\s*(standard )?with ads$|\s*amazon channel$/i, "").toLowerCase();
    if (seenNames.has(name)) return false;
    seenNames.add(name);
    return true;
  });
}

function trailerOf(d) {
  const vids = (d.videos?.results || []).filter((v) => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser"));
  return vids.find((v) => v.iso_639_1 === "fr" && v.type === "Trailer") || vids.find((v) => v.type === "Trailer") || vids[0];
}

function posterHtml(path, cls = "poster", size = "w500") {
  return path ? `<img class="${cls}" src="${IMG}${size}${path}" alt="">` : `<div class="${cls}">🎬</div>`;
}

function whyText(d) {
  const a = state.answers;
  const moods = a.mood.filter((v) => v !== "any").map((v) => option("mood", v).l.toLowerCase());
  const parts = [];
  if (moods.length) parts.push(`ça coche tes envies (${moods.join(", ")})`);
  if (d.vote_average >= 7.5) parts.push(`le public lui met ${d.vote_average.toFixed(1)}/10`);
  if (a.fame === "gem" && d.vote_count < 2500) parts.push("peu de gens l'ont vu");
  if (a.fame === "classic" && d.vote_count > 4000) parts.push("c'est un incontournable");
  if (a.company === "couple" && d.genres.some((g) => g.id === G.romance)) parts.push("parfait en amoureux");
  return parts.length ? `💡 Pourquoi lui : ${parts.join(", ")}.` : "";
}

function resultScreen(d) {
  const year = d.release_date ? d.release_date.slice(0, 4) : "";
  const director = (d.credits?.crew || []).find((c) => c.job === "Director");
  const cast = (d.credits?.cast || []).slice(0, 4).map((c) => c.name);
  const where = providersOf(d);
  const trailer = trailerOf(d);
  const others = state.candidates.slice(state.index + 1, state.index + 6);
  const isFirst = state.index === 0;
  return `<section class="screen">
    <div class="topbar">
      <button class="back" data-action="restart">← Recommencer</button>
      <div style="flex:1"></div>
      <span class="step">${isFirst ? "" : `Idée n°${state.index + 1}`}</span>
    </div>
    ${isFirst && state.relaxed.length ? `<p class="note">Pour trouver la perle, j'ai assoupli ${esc(state.relaxed.join(", "))}.</p>` : ""}
    <div class="result">
      ${posterHtml(d.poster_path)}
      <div>
        <div class="kicker">${isFirst ? "Le film parfait pour ce soir" : "Et pourquoi pas…"}</div>
        <h1>${esc(d.title)}</h1>
        ${d.original_title && d.original_title !== d.title ? `<div class="muted small">${esc(d.original_title)}</div>` : ""}
        <div class="meta">
          ${year ? `<span>${year}</span>` : ""}
          ${d.runtime ? `<span>${formatRuntime(d.runtime)}</span>` : ""}
          <span class="score">★ ${d.vote_average.toFixed(1)}</span>
          <span>${d.vote_count.toLocaleString("fr-FR")} votes</span>
        </div>
        <div class="chips">${d.genres.map((g) => `<span class="chip">${esc(g.name)}</span>`).join("")}</div>
        ${d.tagline ? `<p class="tagline">«&nbsp;${esc(d.tagline)}&nbsp;»</p>` : ""}
        <p class="overview">${esc(d.overview || "Pas de résumé disponible.")}</p>
        <div class="people">
          ${director ? `Réalisé par <b>${esc(director.name)}</b><br>` : ""}
          ${cast.length ? `Avec <b>${cast.map(esc).join("</b>, <b>")}</b>` : ""}
        </div>
        ${whyText(d) ? `<div class="why">${esc(whyText(d))}</div>` : ""}
        <div class="where">
          <h4>${where.kind || "Disponibilité"}</h4>
          ${where.list.length
            ? `<div class="logos">${where.list.slice(0, 6).map((p) => `<img src="${IMG}w92${p.logo_path}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">`).join("")}
               ${where.link ? `<a class="small" href="${esc(where.link)}" target="_blank" rel="noopener">Voir les offres →</a>` : ""}</div>`
            : `<span class="muted small">Pas d'offre de streaming connue en France pour l'instant.</span>`}
        </div>
        <div class="actions">
          <button class="btn" data-action="pick">🍿 On regarde ça !</button>
          <button class="btn ghost" data-action="another">🔁 Autre chose</button>
          <button class="btn ghost" data-action="seen">👀 Déjà vu</button>
          ${trailer ? `<a class="btn ghost" href="https://www.youtube.com/watch?v=${esc(trailer.key)}" target="_blank" rel="noopener">▶️ Bande-annonce</a>` : ""}
        </div>
      </div>
    </div>
    ${others.length ? `<div class="others">
      <h3>Sinon, j'ai aussi pensé à…</h3>
      <div class="strip">${others.map((m, k) => `<button class="thumb" data-jump="${state.index + 1 + k}">
        ${m.poster_path ? `<img src="${IMG}w185${m.poster_path}" alt="">` : `<div class="ph">🎬</div>`}
        <span>${esc(m.title)}</span></button>`).join("")}</div>
    </div>` : ""}
  </section>`;
}

function decidedScreen(d) {
  const trailer = trailerOf(d);
  const where = providersOf(d);
  launchConfetti();
  return `<section class="screen decided">
    ${posterHtml(d.poster_path)}
    <div class="kicker">C'est décidé !</div>
    <h1>Ce soir : <span class="grad">${esc(d.title)}</span></h1>
    <p class="muted">Bonne séance 🥰 Pense aux plaids et au pop-corn.</p>
    ${where.link ? `<a class="btn" href="${esc(where.link)}" target="_blank" rel="noopener">Où le regarder</a>` : ""}
    ${trailer ? `<iframe class="video" src="https://www.youtube-nocookie.com/embed/${esc(trailer.key)}" title="Bande-annonce" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>` : ""}
    <div class="row" style="justify-content:center">
      <button class="btn ghost" data-action="back-to-result">← Finalement non</button>
      <button class="btn ghost" data-action="restart">Recommencer</button>
    </div>
  </section>`;
}

function launchConfetti() {
  const box = document.createElement("div");
  box.className = "confetti";
  const pieces = ["🍿", "🎬", "✨", "💖", "⭐", "🎉"];
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("span");
    s.textContent = pieces[i % pieces.length];
    s.style.left = `${Math.random() * 100}vw`;
    s.style.animationDuration = `${2.2 + Math.random() * 2.2}s`;
    s.style.animationDelay = `${Math.random() * 0.8}s`;
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 5500);
}

// ---------- Interactions ----------

function goTo(step) {
  state.step = step;
  if (step < 0) return render(welcomeScreen());
  if (step >= QUESTIONS.length) return search();
  render(questionScreen());
}

function toggle(q, v) {
  const o = option(q.id, v);
  if (!q.multi) {
    state.answers[q.id] = v;
    refreshSelection(q);
    return setTimeout(() => goTo(state.step + 1), 220);
  }
  let list = [].concat(state.answers[q.id] || []);
  if (list.includes(v)) list = list.filter((x) => x !== v);
  else if (o.exclusive) list = [v];
  else {
    list = list.filter((x) => !option(q.id, x).exclusive);
    if (list.length >= q.multi) list.shift();
    list.push(v);
  }
  state.answers[q.id] = list;
  refreshSelection(q);
}

// Mise à jour sur place : un re-rendu complet rejouerait l'animation d'entrée à chaque clic.
function refreshSelection(q) {
  const chosen = [].concat(state.answers[q.id] || []);
  app.querySelectorAll("[data-opt]").forEach((b) => b.classList.toggle("sel", chosen.includes(b.dataset.opt)));
  const next = app.querySelector('[data-action="next"]');
  if (next) next.disabled = !chosen.length;
}

app.addEventListener("click", (ev) => {
  const optBtn = ev.target.closest("[data-opt]");
  if (optBtn) return toggle(QUESTIONS[state.step], optBtn.dataset.opt);
  const jump = ev.target.closest("[data-jump]");
  if (jump) return showCandidate(Number(jump.dataset.jump));
  const action = ev.target.closest("[data-action]")?.dataset.action;
  const current = state.candidates[state.index];
  switch (action) {
    case "start": return goTo(0);
    case "back": return goTo(state.step - 1);
    case "next": return goTo(state.step + 1);
    case "retry":
      if (state.step < QUESTIONS.length) return boot();
      return state.candidates.length ? showCandidate(state.index) : search();
    case "restart":
      state.answers = {};
      state.candidates = [];
      return goTo(-1);
    case "another": return showCandidate(state.index + 1);
    case "seen": {
      const s = seen();
      s.add(current.id);
      localStorage.setItem(SEEN_KEY, JSON.stringify([...s]));
      state.candidates.splice(state.index, 1);
      return showCandidate(state.index);
    }
    case "pick": return render(decidedScreen(state.details[current.id]));
    case "back-to-result": return showCandidate(state.index);
  }
});

app.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const key = form.key.value.trim();
  const btn = form.querySelector("button");
  btn.disabled = true;
  btn.textContent = "Vérification…";
  try {
    await tmdb("/configuration", {}, key);
    state.key = key;
    localStorage.setItem(STORE_KEY, key);
    await boot();
  } catch (err) {
    render(setupScreen(err.auth ? "Cette clé n'est pas reconnue par TMDB." : "Impossible de joindre TMDB, vérifie la connexion."));
  }
});

async function boot() {
  // Permet de partager un lien prêt à l'emploi : index.html#key=XXXX
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("key");
  if (fromHash) {
    state.key = fromHash;
    localStorage.setItem(STORE_KEY, fromHash);
    history.replaceState(null, "", location.pathname + location.search);
  }
  if (!state.key) return render(setupScreen());
  try {
    await loadReferenceData();
    goTo(-1);
  } catch (err) {
    handleError(err);
  }
}

boot();
